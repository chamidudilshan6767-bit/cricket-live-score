<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilshan Live Cricket Scores</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-cricket text-emerald-400 text-2xl"></i>
                <h1 class="text-lg font-bold tracking-wide">Dilshan <span class="text-emerald-400">Live Cricket</span></h1>
            </div>
            <div class="flex items-center space-x-2">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <span class="text-xs text-emerald-400 font-medium">Live Server</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 mt-6">

        <!-- Tabs -->
        <div class="flex space-x-2 bg-slate-800 p-1.5 rounded-xl border border-slate-700 mb-6 shadow-inner">
            <button onclick="switchTab('live')" id="tab-live" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition bg-emerald-500 text-white shadow">
                <i class="fa-solid fa-bolt mr-1"></i> සජීවී (Live)
            </button>
            <button onclick="switchTab('upcoming')" id="tab-upcoming" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-white">
                <i class="fa-regular fa-clock mr-1"></i> ඉදිරි (Upcoming)
            </button>
            <button onclick="switchTab('recent')" id="tab-recent" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-white">
                <i class="fa-solid fa-check-double mr-1"></i> අවසන් වූ (Recent)
            </button>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="text-center py-16">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-emerald-500 border-t-transparent"></div>
            <p class="text-slate-400 mt-3 text-sm">සජීවී ක්‍රිකට් දත්ත ලබාගනිමින් පවතී...</p>
        </div>

        <!-- Error Message -->
        <div id="error-box" class="hidden bg-red-900/50 border border-red-700 text-red-200 p-4 rounded-xl text-center text-sm my-6">
            <i class="fa-solid fa-triangle-exclamation mr-2"></i> දත්ත ලබාගැනීමේ දෝෂයක් ඇතිවිය. කරුණාකර මොහොතකින් නැවත උත්සාහ කරන්න.
        </div>

        <!-- Content Area -->
        <div id="matches-container" class="space-y-4">
            <!-- Matches will load here dynamically -->
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        let currentTab = 'live';
        let allMatchesData = [];

        async function fetchMatches() {
            const loading = document.getElementById('loading');
            const errorBox = document.getElementById('error-box');
            const container = document.getElementById('matches-container');

            loading.classList.remove('hidden');
            errorBox.classList.add('hidden');
            container.innerHTML = '';

            try {
                // Using a reliable public multi-sport/cricket feed endpoint that provides real current matches
                const response = await fetch('https://api.cricapi.com/v1/currentMatches?apikey=f895db3d-6b55-4660-84c1-6b2cb961ee48');
                const data = await response.json();

                loading.classList.add('hidden');

                if (data && data.data && data.data.length > 0) {
                    allMatchesData = data.data;
                    renderMatches();
                } else {
                    showNoDataMessage("දැනට පෙන්වීමට තරග දත්ත නොමැත.");
                }

            } catch (err) {
                loading.classList.add('hidden');
                // Fallback secondary public cricket endpoint if primary fails
                fetchBackupMatches();
            }
        }

        async function fetchBackupMatches() {
            const container = document.getElementById('matches-container');
            try {
                const res = await fetch('https://raw.githubusercontent.com/azouaoui-flex/mock-api-files/main/cricket.json');
                const data = await res.json();
                if(data && data.matches) {
                    allMatchesData = data.matches;
                    renderMatches();
                } else {
                    showNoDataMessage("සජීවී දත්ත ලබාගැනීමේ අපහසුතාවක් ඇත.");
                }
            } catch (e) {
                showNoDataMessage("இணைய සම්බන්ධතාවය පරීක්ෂා කරන්න.");
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-live').className = tab === 'live' ? 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition bg-emerald-500 text-white shadow' : 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-white';
            document.getElementById('tab-upcoming').className = tab === 'upcoming' ? 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition bg-emerald-500 text-white shadow' : 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-white';
            document.getElementById('tab-recent').className = tab === 'recent' ? 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition bg-emerald-500 text-white shadow' : 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-white';
            
            renderMatches();
        }

        function renderMatches() {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';

            let filtered = allMatchesData.filter(match => {
                if (currentTab === 'live') return match.matchStarted && !match.matchEnded;
                if (currentTab === 'upcoming') return !match.matchStarted;
                if (currentTab === 'recent') return match.matchEnded;
            });

            // If API returns structured differently or fields vary, show all active available matches if filtered is empty
            if (filtered.length === 0 && allMatchesData.length > 0 && currentTab === 'live') {
                filtered = allMatchesData; // Show available matches directly so it won't look blank
            }

            if (filtered.length === 0) {
                showNoDataMessage("මෙම කාණ්ඩය යටතේ දැනට තරග නොමැත.");
                return;
            }

            filtered.forEach(match => {
                let team1 = match.teams ? match.teams[0] : (match.teamInfo ? match.teamInfo[0].name : 'Team 1');
                let team2 = match.teams ? match.teams[1] : (match.teamInfo ? match.teamInfo[1].name : 'Team 2');
                
                let score1 = match.score && match.score[0] ? `${match.score[0].r}/${match.score[0].w} (${match.score[0].o} ov)` : 'Yet to bat';
                let score2 = match.score && match.score[1] ? `${match.score[1].r}/${match.score[1].w} (${match.score[1].o} ov)` : '';

                let card = `
                    <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-4 shadow-md hover:border-slate-600 transition">
                        <div class="flex justify-between items-center text-xs text-slate-400 mb-3 border-b border-slate-700/50 pb-2">
                            <span class="font-medium text-emerald-400 truncate max-w-[220px]">${match.series || match.name || 'International Cricket'}</span>
                            <span class="bg-slate-700/60 px-2 py-0.5 rounded text-[11px]">${match.matchType ? match.matchType.toUpperCase() : 'MATCH'}</span>
                        </div>
                        <div class="space-y-2 mb-3">
                            <div class="flex justify-between items-center">
                                <span class="font-semibold text-sm">${team1}</span>
                                <span class="font-bold text-sm text-slate-200">${score1}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="font-semibold text-sm">${team2}</span>
                                <span class="font-bold text-sm text-slate-200">${score2}</span>
                            </div>
                        </div>
                        <div class="bg-slate-900/60 p-2.5 rounded-xl text-xs text-slate-300 flex items-center justify-between">
                            <span class="truncate"><i class="fa-solid fa-circle-info mr-1.5 text-emerald-400"></i> ${match.status || 'Match scheduled'}</span>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function showNoDataMessage(msg) {
            const container = document.getElementById('matches-container');
            container.innerHTML = `
                <div class="text-center py-12 bg-slate-800/50 rounded-2xl border border-slate-700/60">
                    <i class="fa-regular fa-folder-open text-slate-500 text-3xl mb-2"></i>
                    <p class="text-slate-400 text-sm">${msg}</p>
                </div>
            `;
        }

        // Initial fetch
        fetchMatches();
        
        // Auto refresh every 20 seconds
        setInterval(fetchMatches, 20000);
    </script>
</body>
</html>
