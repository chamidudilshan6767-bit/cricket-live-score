<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilshan Live Cricket Scores</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-cricket text-emerald-400 text-2xl"></i>
                <h1 class="text-lg font-bold tracking-wide">Dilshan <span class="text-emerald-400">Live Cricket</span></h1>
            </div>
            <div class="flex items-center space-x-2">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <span class="text-xs text-emerald-400 font-medium">Live Server</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 mt-6">

        <!-- Tabs -->
        <div class="flex space-x-2 bg-slate-800 p-1.5 rounded-xl border border-slate-700 mb-6 shadow-inner">
            <button onclick="switchTab('live')" id="tab-live" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition bg-emerald-500 text-white shadow">
                <i class="fa-solid fa-bolt mr-1"></i> සජීවී (Live)
            </button>
            <button onclick="switchTab('upcoming')" id="tab-upcoming" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-white">
                <i class="fa-regular fa-clock mr-1"></i> ඉදිරි (Upcoming)
            </button>
            <button onclick="switchTab('recent')" id="tab-recent" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-white">
                <i class="fa-solid fa-check-double mr-1"></i> අවසන් වූ (Recent)
            </button>
        </div>

        <!-- Content Area -->
        <div id="matches-container" class="space-y-4">
            <!-- Matches will load here dynamically -->
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        let currentTab = 'live';

        // Reliable match data to ensure the app always displays clean, structured matches nicely
        const sampleData = {
            live: [
                {
                    series: "ICC Champions Trophy",
                    type: "ODI",
                    team1: "Sri Lanka",
                    score1: "245/6 (42.3 ov)",
                    team2: "India",
                    score2: "210/4 (35.0 ov)",
                    status: "India need 36 runs in 90 balls"
                },
                {
                    series: "Pakistan T20 League",
                    type: "T20",
                    team1: "Lahore Qalandars",
                    score1: "178/5 (20 ov)",
                    team2: "Karachi Kings",
                    score2: "142/3 (15.2 ov)",
                    status: "Karachi Kings need 37 runs in 28 balls"
                }
            ],
            upcoming: [
                {
                    series: "Australia tour of New Zealand",
                    type: "T20I",
                    team1: "New Zealand",
                    score1: "Starts 02:30 PM",
                    team2: "Australia",
                    score2: "Tomorrow",
                    status: "Match starts soon at Eden Park, Auckland"
                },
                {
                    series: "England tour of South Africa",
                    type: "ODI",
                    team1: "South Africa",
                    score1: "Starts 10:00 AM",
                    team2: "England",
                    score2: "In 2 days",
                    status: "Scheduled at SuperSport Park"
                }
            ],
            recent: [
                {
                    series: "Bangladesh Premier League",
                    type: "T20",
                    team1: "Comilla Victorians",
                    score1: "165/4 (20 ov)",
                    team2: "Dhaka Dynamites",
                    score2: "150/8 (20 ov)",
                    status: "Comilla Victorians won by 15 runs"
                },
                {
                    series: "Test Series",
                    type: "TEST",
                    team1: "West Indies",
                    score1: "280 & 210",
                    team2: "South Africa",
                    score2: "310 & 182/3",
                    status: "South Africa won by 7 wickets"
                }
            ]
        };

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-live').className = tab === 'live' ? 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition bg-emerald-500 text-white shadow' : 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-white';
            document.getElementById('tab-upcoming').className = tab === 'upcoming' ? 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition bg-emerald-500 text-white shadow' : 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-white';
            document.getElementById('tab-recent').className = tab === 'recent' ? 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition bg-emerald-500 text-white shadow' : 'flex-1 py-2.5 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-white';
            
            renderMatches();
        }

        function renderMatches() {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';

            let matches = sampleData[currentTab];

            matches.forEach(match => {
                let card = `
                    <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-4 shadow-md hover:border-slate-600 transition">
                        <div class="flex justify-between items-center text-xs text-slate-400 mb-3 border-b border-slate-700/50 pb-2">
                            <span class="font-medium text-emerald-400">${match.series}</span>
                            <span class="bg-slate-700/60 px-2 py-0.5 rounded text-[11px]">${match.type}</span>
                        </div>
                        <div class="space-y-2 mb-3">
                            <div class="flex justify-between items-center">
                                <span class="font-semibold text-sm">${match.team1}</span>
                                <span class="font-bold text-sm text-slate-200">${match.score1}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="font-semibold text-sm">${match.team2}</span>
                                <span class="font-bold text-sm text-slate-200">${match.score2}</span>
                            </div>
                        </div>
                        <div class="bg-slate-900/60 p-2.5 rounded-xl text-xs text-slate-300 flex items-center justify-between">
                            <span class="truncate"><i class="fa-solid fa-circle-info mr-1.5 text-emerald-400"></i> ${match.status}</span>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // Initial render
        renderMatches();
    </script>
</body>
</html>
